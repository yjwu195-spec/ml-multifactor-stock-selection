project:
  name: bohai_research_ml_strategy_upgrade_v2
  root_dir: .

tushare:
  token: ""
  token_env: TUSHARE_TOKEN

dataset_split:
  train_ratio: 0.50
  validation_ratio: 0.10
  test_ratio: 0.10
  backtest_ratio: 0.30

model:
  top_n: 10
  decile_count: 10
  random_state: 42
  n_jobs: -1

backtest:
  transaction_cost_bps: 10
  index_short_cost_bps: 1
  initial_nav: 1.0

outputs:
  subdir: outputs/improved_v2
  reports_subdir: reports/improved_v2
